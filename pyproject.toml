[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrvoo"
version = "1.0.0"
description = "Gerador de QR Code para buscas de passagens aéreas (Skyscanner, Kayak, Momondo, Google Flights)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "João Ramos" }]
dependencies = ["qrcode[pil]>=7.4", "flask>=3.0"]

[project.scripts]
qrvoo = "qrvoo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qrvoo = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["qrvoo"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
